# Set default terminal and history
set -g default-terminal "screen-256color"
set -g history-limit 10000

# Window and status configuration
set -g renumber-windows on
set -g status-style fg=white,bg=colour234
set-option -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0
setw -g aggressive-resize on

# Updated styling for newer tmux version
set -g window-status-activity-style bold
set -g pane-border-style fg=colour245
set -g pane-active-border-style fg=colour39
set -g message-style fg=colour16,bg=colour221,bold

# Source external theme file
source-file ~/.tmux_line.conf

# Prevent automatic window renaming
set-option -g allow-rename off

# Vim-style copy/paste bindings
unbind [
bind y copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Toggle pane broadcast mode
bind e set-window-option synchronize-panes

# Enable mouse support with custom scroll behavior
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
